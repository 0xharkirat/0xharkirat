name: Refresh profile

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - update_readme.py
      - .github/workflows/profile-card.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # update_readme.py is stdlib only, so there is nothing to install.
      #
      # The portrait SVGs are not built here. make_portrait.py needs Pillow, and its
      # output only changes when the photo does, so it is run by hand.
      #
      # The built-in GITHUB_TOKEN is enough: it lifts the API rate limit, and the extra
      # private repos a personal token would reveal are all in excluded orgs anyway.
      #
      # Leaves README.md untouched if the API is unavailable, so a bad day upstream
      # cannot blank a section.
      - name: Refresh the generated README sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python update_readme.py

      - name: Commit whatever changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh projects and contributions" || echo "No changes to commit"
          git push
